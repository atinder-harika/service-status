spring.application.name=service-status-backend
server.port=${PORT:8080}

# Active profile (local by default, Railway sets SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.atinder.service_status_backend=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
# Health checks run on virtual threads (see HealthCheckService); this also puts Tomcat request threads on them
spring.threads.virtual.enabled=true
monitor.check-interval-ms=${CHECK_INTERVAL_MS:30000}

# JWT for the admin write endpoints. Set real values in the environment.
security.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-32-bytes-min}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:}

# p95/p99 for the check timers in Prometheus
management.metrics.distribution.percentiles-histogram.service_status.check=true
management.metrics.distribution.percentiles-histogram.service_status.check.cycle=true
