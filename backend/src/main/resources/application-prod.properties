# Production profile - Used by Railway
# Railway env vars: DATABASE_URL (jdbc:postgresql://host:port/db), DB_USER, DB_PASSWORD, SPRING_PROFILES_ACTIVE=prod
# They reference the Railway Postgres service, e.g. DB_USER=${{Postgres.PGUSER}}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Configuration (creates the 'prod' schema)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=prod
spring.flyway.default-schema=prod

# Production settings
spring.datasource.hikari.schema=prod
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# Disable debug logging in production
logging.level.com.atinder.service_status_backend=INFO
logging.level.org.springframework.jdbc.core=WARN

# Fail fast in production if the JWT secret isn't set (no dev default)
security.jwt.secret=${JWT_SECRET}
